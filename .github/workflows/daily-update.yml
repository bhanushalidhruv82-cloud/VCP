name: Daily Stock Data Update

on:
  schedule:
    # 23:30 UTC daily = ~5:00 AM IST, after US market close
    - cron: "30 23 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily incremental update (both watchlists)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python daily_update.py --target both
