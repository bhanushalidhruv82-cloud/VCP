services:
  # ------------------------------------------------------------------
  # Web app (dashboard + API)
  # ------------------------------------------------------------------
  - type: web
    name: stock-dashboard
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FLASK_DEBUG
        value: "false"

  # ------------------------------------------------------------------
  # Daily incremental data-update job (runs once a day, both watchlists)
  # ------------------------------------------------------------------
  - type: cron
    name: daily-stock-update
    env: python
    plan: starter
    schedule: "30 23 * * *"   # 23:30 UTC = 05:00 IST, after US market close
    buildCommand: pip install -r requirements.txt
    startCommand: python daily_update.py
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
