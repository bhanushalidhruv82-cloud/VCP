      j++;
    }

    // --- Post-wave breakout scan ---
    // If no break was found between waves, check candles AFTER the last wave
    if (breakoutIdx === -1 && run.length >= 2) {
      const resistance = getResistanceLevel(run);
      const killLevel = resistance * (1 + VCP_BREAKOUT_KILL_PCT);
      const lastEndIdx = run[run.length - 1].pEnd.index;
      for (let k = lastEndIdx + 1; k < candles.length; k++) {
        if (candles[k].close > killLevel) {
          breakoutIdx = k;
          break;
        }
      }
    }

    // Connect and record only those segments forming a valid VCP run
    if (run.length >= MIN_WAVES) {
      const combinedData = buildConnectedRun(run, candles);
      runsData.push({ data: combinedData, run: run, breakoutIdx: breakoutIdx });
    }
    // If we switched to the finer candidate list, `j` indexes into that list,
    // not `candidates` — so resume the outer scan from the next main-list wave.
    i = (activeCandidates === candidates && j > i + 1) ? j : i + 1;
  }

  return mergeAdjacentRuns(runsData, candles);
}

/**
 * Builds every combination of (resistanceHighDiffPct, smallWaveDepth,
 * resistanceApproachPct) from the configured ranges above.
 */
function buildParamCombinations() {
  const combos = [];
  RESISTANCE_HIGH_DIFF_PCT_RANGE.forEach(resistanceHighDiffPct => {
    SMALL_WAVE_DEPTH_RANGE.forEach(smallWaveDepth => {
      VCP_RESISTANCE_APPROACH_PCT_RANGE.forEach(resistanceApproachPct => {
        combos.push({ resistanceHighDiffPct, smallWaveDepth, resistanceApproachPct });
      });
    });
  });
  return combos;
}

/**
 * Builds a stable identity key for a VCP run so the same pattern detected
 * under different parameter combinations can be recognized as a duplicate.
 * Keyed on the run's start/end times, wave count, and rounded resistance
 * level — different parameter combos that land on the same underlying
 * pattern will produce (near-)identical keys.
 */
function runIdentityKey(run) {
  const start = run[0].pStart.time;
  const end = run[run.length - 1].pEnd.time;
  const resistance = getResistanceLevel(run);
  const roundedResistance = Math.round(resistance * 100) / 100;
  return `${start}|${end}|${run.length}|${roundedResistance}`;
}

/**
 * Runs VCP detection across every configured parameter combination for the
 * given pivot depth (sensitivity), merges all detected runs into a single
 * array, and removes duplicates (the same VCP pattern found by more than
 * one parameter combination) so each VCP appears only once.
 */
function calculateWaveSegmentsMultiParam(candles, depth) {
  const combos = buildParamCombinations();
  const seen = new Map();

  combos.forEach(({ smallWaveDepth, resistanceApproachPct }) => {
    const runsData = calculateWaveSegments(candles, depth, smallWaveDepth, resistanceApproachPct);
    runsData.forEach(entry => {
      const key = runIdentityKey(entry.run);
      if (!seen.has(key)) {
        seen.set(key, entry);
      }
    });
  });

  const deduped = Array.from(seen.values());
  deduped.sort((a, b) => new Date(a.run[0].pStart.time) - new Date(b.run[0].pStart.time));
  return deduped;
}

// Maximum gap (in bars) allowed between the end of one run and the start of
// the next for them to be considered a continuation of the same VCP rather
// than a fresh, unrelated pattern. The kill-level breakout that splits a
// run can itself take many bars to resolve (price can drift for weeks
// before the next pivot is detected), so this needs to be generous rather
// than a tight few-bar window.
const REATTACH_MAX_GAP_BARS = 40;
// How far above the previous run's resistance the next run's first wave is
// still allowed to start and still count as "the same base" rather than a
// clean breakout that has moved on to a new range. Expressed as an extra
// buffer on top of VCP_RESISTANCE_APPROACH_PCT.
const REATTACH_PRICE_BUFFER_PCT = 0.08;

/**
 * A run gets hard-terminated the moment a candle *closes* more than
 * VCP_BREAKOUT_KILL_PCT above resistance — but that close isn't always a
 * genuine, final breakout. Often it's just the peak of the VCP's next
 * contraction wave, which the algorithm re-detects as a brand-new run
 * starting moments later. When that next run begins right where the
 * previous one ended and its first wave tops out close to the previous
 * run's own resistance level (rather than escaping far above it), the two
 * are stitched back together into a single continuous VCP instead of being
 * drawn as two separate, disconnected boxes.
 */
function mergeAdjacentRuns(runsData, candles) {
  if (runsData.length < 2) return runsData;

  const merged = [runsData[0]];
  for (let i = 1; i < runsData.length; i++) {
    const prevEntry = merged[merged.length - 1];
    const currEntry = runsData[i];
    const prevRun = prevEntry.run;
    const currRun = currEntry.run;

    const prevLastEndIdx = prevRun[prevRun.length - 1].pEnd.index;
    const currFirstStartIdx = currRun[0].pStart.index;
    const gap = currFirstStartIdx - prevLastEndIdx;

    const prevResistance = getResistanceLevel(prevRun);
    const currFirstHigh = currRun[0].pStart.value;
    const priceTolerance = 1 + VCP_RESISTANCE_APPROACH_PCT + REATTACH_PRICE_BUFFER_PCT;

    const startsSoonAfter = gap >= 0 && gap <= REATTACH_MAX_GAP_BARS;
    const staysNearOldResistance = currFirstHigh <= prevResistance * priceTolerance;

    if (window.VCP_DEBUG) {
      console.log('[merge check]', {
        prevEnd: prevRun[prevRun.length - 1].pEnd.time,
        currStart: currRun[0].pStart.time,
        gap, gapLimit: REATTACH_MAX_GAP_BARS, startsSoonAfter,
        prevResistance, currFirstHigh,
        priceTolerance, staysNearOldResistance,
        willMerge: startsSoonAfter && staysNearOldResistance
      });
    }

    if (startsSoonAfter && staysNearOldResistance) {
      const mergedRun = prevRun.concat(currRun);
      merged[merged.length - 1] = {
        data: buildConnectedRun(mergedRun, candles),
        run: mergedRun,
        breakoutIdx: currEntry.breakoutIdx, // the later run's breakout now governs the merged one
      };
    } else {
      merged.push(currEntry);
    }
  }
  return merged;
}

/**
 * Removes nested/overlapping duplicate VCP runs.
 * If two runs cover almost the same time window and their resistance levels
 * are very close, keep the stronger one (more waves, then longer span).
 */
function pruneDuplicateRuns(runs) {
  if (runs.length < 2) return runs;

  const spanOf = (run) => {
    const start = new Date(run[0].pStart.time).getTime();
    const end = new Date(run[run.length - 1].pEnd.time).getTime();
    return { start, end, span: Math.max(0, end - start) };
  };

  const resistanceOf = (run) => getResistanceLevel(run);

  const sorted = [...runs].sort((a, b) => {
    const sa = spanOf(a.run);
    const sb = spanOf(b.run);
    if (sb.span !== sa.span) return sb.span - sa.span;
    if (b.run.length !== a.run.length) return b.run.length - a.run.length;
    return sa.start - sb.start;
  });

  const kept = [];

  for (const entry of sorted) {
    const currSpan = spanOf(entry.run);
    const currRes = resistanceOf(entry.run);

    let duplicate = false;

    for (const keptEntry of kept) {
      const keptSpan = spanOf(keptEntry.run);
      const keptRes = resistanceOf(keptEntry.run);

      const overlap = Math.min(currSpan.end, keptSpan.end) - Math.max(currSpan.start, keptSpan.start);
      if (overlap <= 0) continue;

      const overlapRatio = overlap / Math.min(currSpan.span || 1, keptSpan.span || 1);
      const resDiff = Math.abs(currRes - keptRes) / Math.max(currRes, keptRes, 1);

      const nested = overlapRatio >= 0.7 && resDiff <= 0.08;
      const insideKept =
        currSpan.start >= keptSpan.start &&
        currSpan.end <= keptSpan.end &&
        resDiff <= 0.08;

      if (nested || insideKept) {
        duplicate = true;
        break;
      }
    }

    if (!duplicate) kept.push(entry);
  }

  return kept.sort((a, b) => new Date(a.run[0].pStart.time) - new Date(b.run[0].pStart.time));
}

/**
 * Keeps only the most relevant VCP runs for display.
 * This avoids drawing two boxes on top of each other when one detected run
 * is just a smaller nested wave inside a larger base.
 */
function keepBestRuns(runs) {
  return pruneDuplicateRuns(runs);
}

// Keeps only VCP runs whose first wave (pStart) started within the last
// `months` months (measured from today's real-world date).
function filterRunsByLookback(runs, months) {
  const now          = new Date();
  const lookbackDate = new Date(now.getFullYear(), now.getMonth() - months, now.getDate());
  return runs.filter(({ run }) => new Date(run[0].pStart.time) >= lookbackDate);
}

function clearWaves() {
  activeWaveSeriesList.forEach(series => {
    try {
      chart.removeSeries(series);
    } catch (e) {}
  });
  activeWaveSeriesList = [];
}

const WAVE_PIXEL_OFFSET = 6; // shift wave line this many pixels below the candles

function shiftValueDownByPixels(value, pixels) {
  const coord = candleSeries.priceToCoordinate(value);
  if (coord === null) return value;
  const shiftedPrice = candleSeries.coordinateToPrice(coord + pixels);
  return shiftedPrice !== null ? shiftedPrice : value;
}

/**
 * Determine the actual resistance level for a run — used for breakout
 * detection, duplicate-run comparison, the screener's missed-entry check,
 * AND the visual resistance bar placement. Based on the average of all
 * wave highs in the run (so it sits at the center of the base) plus a
 * small 0.3% buffer.
 */
function getResistanceLevel(run) {
  if (!run || run.length === 0) return null;
  const highs = run.map(w => w.pStart.value);
  const avgHigh = highs.reduce((sum, h) => sum + h, 0) / highs.length;
  return avgHigh * 1.003; // 0.3% above the average high
}

// Kept as an alias so existing references to the bar-placement helper
// still work — both now resolve to the same actual resistance level.
function getResistanceBarLevel(run) {
  return getResistanceLevel(run);
}

// How far above the run's ORIGINAL resistance (see getOriginalResistance)
// a VCP is still allowed to sit and count as a live setup for the
// screener. A VCP must end inside its own box, or at most this tolerance
// above the resistance bar — anything that closes further above than this
// is treated as a genuine breakout and the ticker is dropped from the
// screener tab.
const SCREENER_POST_RUN_BREAKOUT_PCT = 0.01;

/**
 * Resistance level anchored to a run's ORIGINAL box — i.e. only its first
 * two waves — rather than the full (possibly merged/extended) run.
 *
 * getResistanceLevel() averages the pStart high of every wave in the run.
 * That's fine for drawing the box on the chart, but it means a run that
 * has been stitched together (via mergeAdjacentRuns) out of several
 * successive breakout-and-reconsolidate segments will have its resistance
 * "average" quietly drift upward as each new, higher segment is folded
 * in — so a ticker that has clearly broken out and run far above its
 * original box can still look like it's sitting right at "resistance"
 * relative to its own inflated average. For the screener we want the
 * resistance bar as originally established by the pattern, so later waves
 * can only be judged against it, not redefine it.
 */
function getOriginalResistance(run) {
  return getResistanceLevel(run.slice(0, Math.min(2, run.length)));
}

/**
 * Screener-only validity check for a completed run. Flags the run as
 * "entry missed" (and therefore excluded from the screener) if:
 *   1. Price has made a new low below the run's own lowest low anywhere
 *      across the pattern's span (structure broke down), or
 *   2. The MOST RECENT close is more than SCREENER_POST_RUN_BREAKOUT_PCT
 *      above the run's ORIGINAL resistance level.
 *
 * Note this deliberately looks at where price stands RIGHT NOW, not
 * whether any individual wave's peak poked above resistance along the
 * way. A VCP's waves often spike above the resistance line mid-pattern
 * (a "shakeout") and then pull back under the box — that's normal,
 * expected VCP behavior, not a breakout, so it must not disqualify the
 * ticker as long as price has since come back inside the box (or within
 * tolerance). Only a CURRENT close that's still clearly above resistance
 * counts as "the pattern has broken out and moved on."
 */
function isEntryMissed(run, candles) {
  const runLow = Math.min(...run.map(w => w.pMid.value));
  const resistance = getOriginalResistance(run);
  const breakoutLevel = resistance * (1 + SCREENER_POST_RUN_BREAKOUT_PCT);

  // Structure check: any close across the pattern's span (from its first
  // wave onward) making a new low below the run's own lowest low means
  // the base broke down and the setup is no longer valid.
  const firstStartIdx = run[0].pStart.index;
  for (let k = firstStartIdx; k < candles.length; k++) {
    if (candles[k].low < runLow) return true;
  }

  // Current-state check: only the MOST RECENT close matters for whether
  // the VCP is still "live" — it must sit inside the box or at most the
  // allowed tolerance above the original resistance level.
  const currentClose = candles[candles.length - 1].close;
  if (currentClose > breakoutLevel) return true;

  // Breakdown check: if price has since fallen back down through the
  // LAST wave's own low (its most recent pMid), the pattern has broken
  // down out the bottom even though that low may still be above the
  // run's overall lowest low (which only catches breakdowns below the
  // very first/deepest wave). A VCP is only a live setup if the most
  // recent close is still holding above its most recent wave's low.
  const lastWaveLow = run[run.length - 1].pMid.value;
  if (currentClose < lastWaveLow) return true;

  return false;
}

// Max number of days allowed to have elapsed between the end of a VCP box
// (its last wave's pEnd) and the most recent candle for the ticker to
// still be considered "fresh" by the screener. Anything older than this is
// considered stale — the box finished too long ago — and is excluded.
const SCREENER_MAX_DAYS_SINCE_BOX_END = 10;

// Returns true if the VCP box has ended (there's at least one candle after
// the run's last wave) AND no more than SCREENER_MAX_DAYS_SINCE_BOX_END
// days have passed between the box's end and the most recent candle.
function isBoxEndWithinOneWeek(run, candles) {
  const lastEndIdx = run[run.length - 1].pEnd.index;
  // Box must have actually ended — need at least one candle after it.
  if (lastEndIdx >= candles.length - 1) return false;

  const boxEndTime = new Date(run[run.length - 1].pEnd.time).getTime();
  const lastCandleTime = new Date(candles[candles.length - 1].time).getTime();
  const daysSinceBoxEnd = (lastCandleTime - boxEndTime) / (1000 * 60 * 60 * 24);

  return daysSinceBoxEnd <= SCREENER_MAX_DAYS_SINCE_BOX_END;
}

function updateWaves() {
  clearWaves();
  if (!rawCandles || rawCandles.length === 0) return;

  const show = document.getElementById('toggle-waves').checked;
  if (!show) return;

  const depth = parseInt(document.getElementById('wave-depth').value, 10);
  const runs  = calculateWaveSegmentsMultiParam(rawCandles, depth);

  // ---- Time filter + duplicate/nested-run pruning ----
  const filteredRuns = keepBestRuns(filterRunsByLookback(runs, VCP_LOOKBACK_MONTHS));

  // ---- Draw each qualifying VCP run ----
  filteredRuns.forEach(({ data, run, breakoutIdx }) => {
    // ---- 1. Wave curve line (shifted below candles) ----
    const series = chart.addLineSeries({
      color:     '#ffb300',
      lineWidth: 3.5,
      lineType:  LightweightCharts.LineType.Curved,
      lineStyle: LightweightCharts.LineStyle.Solid,
      crosshairMarkerVisible: false,
      priceLineVisible:  false,
      lastValueVisible:  false,
    });
    const shiftedData = data.map(d => ({
      time:  d.time,
      value: shiftValueDownByPixels(d.value, WAVE_PIXEL_OFFSET),
    }));
    series.setData(shiftedData);

    // Valley markers
    const markers = [];
    run.forEach(w => {
      markers.push({
        time: w.pMid.time,
        position: 'belowBar',
        color: '#ffb300',
        shape: 'circle',
        size: 0,
        text: w.pMid.value.toFixed(2),
      });
    });
    series.setMarkers(markers);
    activeWaveSeriesList.push(series);

    // ---- 2. Resistance range (thin rectangle) + Box ----
    const firstLow      = run[0].pMid.value;             // deepest point (1st wave)
    const startTime     = run[0].pStart.time;
    // The resistance bar / box always ends at this VCP run's own last wave —
    // it must not extend forward into where the next VCP begins, even if a
    // breakout candle was found further out.
    const endTime = run[run.length - 1].pEnd.time;

    // Resistance range: place the bar around the average of all wave highs
    // so it sits inside the base instead of being tied to the 2nd wave.
    const avgResistanceHigh = getResistanceBarLevel(run);
    const RESISTANCE_GAP_PX   = 2;  // small clearance around the average high
    const RESISTANCE_RANGE_PX = 8;  // thickness of the resistance band
    const resBot = shiftValueDownByPixels(avgResistanceHigh, -RESISTANCE_GAP_PX);   // slightly above the average high
    const resTop = shiftValueDownByPixels(resBot, -RESISTANCE_RANGE_PX);            // band's top edge

    const resColor   = 'rgba(100, 181, 246, 0.85)';
    const boxColor   = 'rgba(100, 181, 246, 0.5)';
    const boxFaint   = 'rgba(100, 181, 246, 0.3)';
    const baseOpts   = {
      crosshairMarkerVisible: false,
      priceLineVisible: false,
      lastValueVisible: false,
    };

    // === RESISTANCE RANGE (thin rectangle at the top) ===

    // Top edge of resistance range
    const resTopLine = chart.addLineSeries({
      ...baseOpts, color: resColor, lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
    });
    resTopLine.setData([
      { time: startTime, value: resTop },
      { time: endTime,   value: resTop },
    ]);
    activeWaveSeriesList.push(resTopLine);

    // Bottom edge of resistance range (also top edge of main box)
    const resBotLine = chart.addLineSeries({
      ...baseOpts, color: resColor, lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
    });
    resBotLine.setData([
      { time: startTime, value: resBot },
      { time: endTime,   value: resBot },
    ]);
    activeWaveSeriesList.push(resBotLine);

    // Left vertical of resistance range (straight — same time as top/bottom edges)
    const resLv = chart.addLineSeries({
      ...baseOpts, color: resColor, lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Solid,
    });
    resLv.setData([
      { time: startTime, value: resTop },
      { time: startTime, value: resBot },
    ]);
    activeWaveSeriesList.push(resLv);

    // Right vertical of resistance range (straight)
    const resRv = chart.addLineSeries({
      ...baseOpts, color: resColor, lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Solid,
    });
    resRv.setData([
      { time: endTime, value: resTop },
      { time: endTime, value: resBot },
    ]);
    activeWaveSeriesList.push(resRv);

    // === MAIN BOX (from resistance range bottom down to first wave low) ===

    // Bottom edge - first wave low (dashed)
    const boxBottomLine = chart.addLineSeries({
      ...baseOpts, color: boxFaint, lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
    });
    boxBottomLine.setData([
      { time: startTime, value: firstLow },
      { time: endTime,   value: firstLow },
    ]);
    activeWaveSeriesList.push(boxBottomLine);

    // Left vertical edge of main box (straight)
    const boxLv = chart.addLineSeries({
      ...baseOpts, color: boxColor, lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Solid,
    });
    boxLv.setData([
      { time: startTime, value: resBot },
      { time: startTime, value: firstLow },
    ]);
    activeWaveSeriesList.push(boxLv);

    // Right vertical edge of main box (straight)
    const boxRv = chart.addLineSeries({
      ...baseOpts, color: boxColor, lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Solid,
    });
    boxRv.setData([
      { time: endTime, value: resBot },
      { time: endTime, value: firstLow },
    ]);
    activeWaveSeriesList.push(boxRv);
  });
}

async function loadSymbolList() {
  try {
    const res = await fetch(`/api/symbols?watchlist=${encodeURIComponent(selectedWatchlist)}`);
    allSymbols = await res.json();
    renderSymbolList(allSymbols);
    if (allSymbols.length > 0) {
      selectSymbol(allSymbols[0].symbol);
    }
  } catch (e) {
    document.getElementById('symbol-list').innerHTML =
      '<div style="padding:14px; color:var(--text-dim); font-size:12.5px;">Failed to load symbols.</div>';
  }
}

function renderSymbolList(symbols) {
  const list = document.getElementById('symbol-list');
  list.innerHTML = '';
  symbols.forEach(s => {
    const row = document.createElement('div');
    row.className = 'symbol-row' + (s.symbol === activeSymbol ? ' active' : '');
    row.dataset.symbol = s.symbol;

    const chgClass = s.change_pct > 0 ? 'up' : s.change_pct < 0 ? 'down' : 'flat';
    const chgText = s.change_pct !== null && s.change_pct !== undefined
      ? `${s.change_pct > 0 ? '+' : ''}${s.change_pct}%` : '—';
    const priceText = s.last_close !== null && s.last_close !== undefined
      ? s.last_close.toFixed(2) : '—';

    row.innerHTML = `
      <div class="left">
        <div class="ticker">${s.symbol}</div>
        <div class="meta">${s.row_count} bars</div>
      </div>
      <div class="right">
        <div class="price">${priceText}</div>
        <div class="chg ${chgClass}">${chgText}</div>
      </div>
      <button class="remove-btn" title="Remove ${s.symbol}">&times;</button>
    `;
    row.addEventListener('click', () => selectSymbol(s.symbol));
    row.querySelector('.remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      removeSymbol(s.symbol);
    });
    list.appendChild(row);
  });
}

async function selectSymbol(symbol) {
  activeSymbol = symbol;

  document.querySelectorAll('.symbol-row').forEach(row => {
    row.classList.toggle('active', row.dataset.symbol === symbol);
  });
  document.querySelectorAll('.screener-row').forEach(row => {
    row.classList.toggle('active', row.dataset.symbol === symbol);
  });

  document.getElementById('empty-state').style.display = 'none';
  const statusEl = document.getElementById('status-state');
  const chartEl = document.getElementById('chart');
  chartEl.classList.remove('loaded');
  statusEl.style.display = 'flex';
  statusEl.innerHTML = '<div class="dot-spinner"><span></span><span></span><span></span></div>';

  document.getElementById('symbol-title').textContent = symbol;
  closeSuggestions();

  try {
    const res = await fetch(`/api/ohlcv/${symbol}?watchlist=${encodeURIComponent(selectedWatchlist)}`);
    if (!res.ok) throw new Error('No data');
    const data = await res.json();

    rawCandles = data.candles;
    candleSeries.setData(data.candles);
    volumeSeries.setData(data.volumes);

    updateWaves();
    chartEl.classList.add('loaded');

    // Force both axes back to auto-fit so a previous manual zoom/drag on
    // either the time or price axis doesn't carry over to the new symbol
    // (removes the need to double-click the axes to reset). Deferred to
    // the next tick so it runs after the chart has finished processing
    // the newly-set series data.
    requestAnimationFrame(() => {
      candleSeries.priceScale().applyOptions({ autoScale: true });
      volumeSeries.priceScale().applyOptions({ autoScale: true });
      chart.timeScale().fitContent();
    });

    statusEl.style.display = 'none';
    updateLegend(null);
  } catch (e) {
    statusEl.textContent = `No data available for ${symbol}`;
  }
}

document.getElementById('toggle-waves').addEventListener('change', updateWaves);

// Uses a 100ms debounce to prevent layout calculation freezes during dragging
document.getElementById('wave-depth').addEventListener('input', (e) => {
  const value = e.target.value;
  document.getElementById('depth-val').textContent = value;
  
  clearTimeout(waveDebounceTimeout);
  waveDebounceTimeout = setTimeout(() => {
    updateWaves();
  }, 100);
});

document.getElementById('watchlist-select').addEventListener('change', (e) => {
  selectedWatchlist = e.target.value;
  activeSymbol = null;
  rawCandles = [];
  clearWaves();
  document.getElementById('symbol-title').textContent = 'Select a stock';
  document.getElementById('legend').innerHTML = '';
  document.getElementById('status-state').style.display = 'none';
  document.getElementById('empty-state').style.display = 'flex';
  // Clear any stale screener results from the previous watchlist.
  document.getElementById('screener-results').innerHTML = '';
  document.getElementById('screener-status').textContent = '';
  loadSymbolList();
});

function setAddTickerStatus(text, kind) {
  const el = document.getElementById('add-ticker-status');
  el.textContent = text;
  el.className = 'add-ticker-status' + (kind ? ' ' + kind : '');
}

async function addSymbol() {
  const input = document.getElementById('add-ticker-input');
  const btn = document.getElementById('add-ticker-btn');
  const symbol = input.value.trim().toUpperCase();

  if (!symbol) {
    setAddTickerStatus('Enter a ticker symbol', 'error');
    return;
  }
  if (allSymbols.some(s => s.symbol === symbol)) {
    setAddTickerStatus(`${symbol} is already in the watchlist`, 'error');
    return;
  }

  btn.disabled = true;
  setAddTickerStatus(`Fetching ${symbol}...`, 'loading');

  try {
    const res = await fetch('/api/watchlist/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbol, watchlist: selectedWatchlist }),
    });
    const data = await res.json();

    if (!res.ok || data.status !== 'success') {
      setAddTickerStatus(data.message || `Failed to add ${symbol}`, 'error');
      return;
    }

    setAddTickerStatus(data.message, 'success');
    input.value = '';
    await loadSymbolList();
    selectSymbol(symbol);
  } catch (e) {
    setAddTickerStatus(`Network error while adding ${symbol}`, 'error');
  } finally {
    btn.disabled = false;
  }
}

async function removeSymbol(symbol) {
  if (!confirm(`Remove ${symbol} from the watchlist? This deletes its stored price data.`)) {
    return;
  }

  try {
    const res = await fetch('/api/watchlist/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbol, watchlist: selectedWatchlist }),
    });
    const data = await res.json();

    if (!res.ok || data.status !== 'success') {
      setAddTickerStatus(data.message || `Failed to remove ${symbol}`, 'error');
      return;
    }

    setAddTickerStatus(data.message, 'success');

    if (activeSymbol === symbol) {
      activeSymbol = null;
      rawCandles = [];
      clearWaves();
      candleSeries.setData([]);
      volumeSeries.setData([]);
      document.getElementById('symbol-title').textContent = 'Select a stock';
      document.getElementById('legend').innerHTML = '';
      document.getElementById('empty-state').style.display = 'flex';
    }

    await loadSymbolList();
  } catch (e) {
    setAddTickerStatus(`Network error while removing ${symbol}`, 'error');
  }
}

document.getElementById('add-ticker-btn').addEventListener('click', addSymbol);
document.getElementById('add-ticker-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addSymbol();
});

// =====================================================================
// SEARCH AUTOCOMPLETE / SUGGESTIONS
// =====================================================================
const searchInput = document.getElementById('search');
const suggestionsEl = document.getElementById('search-suggestions');
let suggestionMatches = [];
let highlightedIndex = -1;

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function highlightMatch(symbol, q) {
  const idx = symbol.indexOf(q);
  if (idx === -1 || !q) return escapeHtml(symbol);
  return escapeHtml(symbol.slice(0, idx)) + '<mark>' + escapeHtml(symbol.slice(idx, idx + q.length)) + '</mark>' + escapeHtml(symbol.slice(idx + q.length));
}

function closeSuggestions() {
  suggestionsEl.classList.remove('open');
  suggestionsEl.innerHTML = '';
  suggestionMatches = [];
  highlightedIndex = -1;
}

function renderSuggestions(q) {
  if (!q) { closeSuggestions(); return; }

  suggestionMatches = allSymbols.filter(s => s.symbol.includes(q)).slice(0, 8);
  highlightedIndex = -1;

  if (suggestionMatches.length === 0) {
    suggestionsEl.innerHTML = `<div class="suggestion-empty">No symbols match "${escapeHtml(q)}"</div>`;
    suggestionsEl.classList.add('open');
    return;
  }

  suggestionsEl.innerHTML = suggestionMatches.map((s, i) => {
    const priceText = s.last_close !== null && s.last_close !== undefined ? s.last_close.toFixed(2) : '—';
    return `<div class="suggestion-item" data-index="${i}" data-symbol="${escapeHtml(s.symbol)}">
      <span class="s-ticker">${highlightMatch(s.symbol, q)}</span>
      <span class="s-price">${priceText}</span>
    </div>`;
  }).join('');
  suggestionsEl.classList.add('open');

  suggestionsEl.querySelectorAll('.suggestion-item').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault(); // keep focus behavior predictable, fire before blur
      chooseSuggestion(el.dataset.symbol);
    });
    el.addEventListener('mouseenter', () => {
      highlightedIndex = parseInt(el.dataset.index, 10);
      updateHighlighted();
    });
  });
}

function updateHighlighted() {
  suggestionsEl.querySelectorAll('.suggestion-item').forEach(el => {
    el.classList.toggle('highlighted', parseInt(el.dataset.index, 10) === highlightedIndex);
  });
  const active = suggestionsEl.querySelector('.suggestion-item.highlighted');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function chooseSuggestion(symbol) {
  searchInput.value = symbol;
  closeSuggestions();
  renderSymbolList(allSymbols.filter(s => s.symbol.includes(symbol)));
  if (allSymbols.some(s => s.symbol === symbol)) {
    selectSymbol(symbol);
  }
}

searchInput.addEventListener('input', (e) => {
  const q = e.target.value.trim().toUpperCase();
  const filtered = q ? allSymbols.filter(s => s.symbol.includes(q)) : allSymbols;
  renderSymbolList(filtered);
  renderSuggestions(q);
});

searchInput.addEventListener('focus', (e) => {
  const q = e.target.value.trim().toUpperCase();
  if (q) renderSuggestions(q);
});

searchInput.addEventListener('keydown', (e) => {
  if (!suggestionsEl.classList.contains('open') || suggestionMatches.length === 0) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightedIndex = Math.min(highlightedIndex + 1, suggestionMatches.length - 1);
    updateHighlighted();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightedIndex = Math.max(highlightedIndex - 1, 0);
    updateHighlighted();
  } else if (e.key === 'Enter') {
    if (highlightedIndex >= 0 && suggestionMatches[highlightedIndex]) {
      e.preventDefault();
      chooseSuggestion(suggestionMatches[highlightedIndex].symbol);
    }
  } else if (e.key === 'Escape') {
    closeSuggestions();
  }
});

searchInput.addEventListener('blur', () => {
  // Delay so a mousedown on a suggestion item registers first.
  setTimeout(closeSuggestions, 100);
});

function switchTab(tabName) {
  document.getElementById('tab-btn-watchlist').classList.toggle('active', tabName === 'watchlist');
  document.getElementById('tab-btn-screener').classList.toggle('active', tabName === 'screener');
  document.getElementById('watchlist-panel').classList.toggle('active', tabName === 'watchlist');
  document.getElementById('screener-panel').classList.toggle('active', tabName === 'screener');
}
document.getElementById('tab-btn-watchlist').addEventListener('click', () => switchTab('watchlist'));
document.getElementById('tab-btn-screener').addEventListener('click', () => switchTab('screener'));
document.getElementById('screener-lookback-label').textContent = SCREENER_LOOKBACK_MONTHS;

// Bumped on every new scan so a stale in-flight scan can detect it's been
// superseded and stop writing to the UI.
let screenerRunToken = 0;

/**
 * Scans every symbol in the watchlist across SCREENER_SENSITIVITIES,
 * keeping any symbol that has at least one VCP run whose first wave
 * started within SCREENER_LOOKBACK_MONTHS. Duplicates across sensitivities
 * are allowed by design — the same symbol can appear under multiple
 * sensitivity groups.
 */
async function runScreener() {
  const btn       = document.getElementById('run-screener-btn');
  const statusEl  = document.getElementById('screener-status');
  const resultsEl = document.getElementById('screener-results');

  if (!allSymbols || allSymbols.length === 0) {
    statusEl.textContent = 'No symbols loaded yet.';
    return;
  }

  const myToken = ++screenerRunToken;
  btn.disabled = true;
  btn.textContent = 'Scanning...';
  resultsEl.innerHTML = '';

  const results = {};
  SCREENER_SENSITIVITIES.forEach(depth => { results[depth] = []; });

  const symbols = allSymbols.map(s => s.symbol);
  const total = symbols.length;
  let done = 0;

  // Batching: instead of one HTTP request per symbol (300+ round-trips,
  // 300+ short-lived DB connections), fetch a chunk of symbols' OHLC in a
  // single request. A handful of chunk requests in flight at once keeps the
  // scan fast without piling hundreds of concurrent requests onto the
  // single backend worker (which is what caused the DB/memory pressure and
  // the 502 restarts during a full scan).
  const CHUNK_SIZE = 60;
  const CHUNK_CONCURRENCY = 3;
  const chunks = [];
  for (let i = 0; i < symbols.length; i += CHUNK_SIZE) {
    chunks.push(symbols.slice(i, i + CHUNK_SIZE));
  }

  function processCandles(symbol, candles) {
    if (!candles || candles.length === 0) return;
    const lastClose = candles[candles.length - 1].close;
    SCREENER_SENSITIVITIES.forEach(depth => {
      const runs     = calculateWaveSegmentsMultiParam(candles, depth);
      const filtered = keepBestRuns(filterRunsByLookback(runs, SCREENER_LOOKBACK_MONTHS));
      if (filtered.length === 0) return;

      // A symbol can have more than one VCP run inside the lookback
      // window (an old one and a fresher one). Only the MOST RECENT
      // run reflects the stock's current state, so that's the only
      // one we judge for the "already broken out" check — otherwise
      // an old, already-extended run could let the symbol slip
      // through just because some earlier run still looked tight.
      const mostRecent = filtered[filtered.length - 1].run;

      if (!isEntryMissed(mostRecent, candles) && isBoxEndWithinOneWeek(mostRecent, candles)) {
        results[depth].push({ symbol, lastClose });
      }
    });
  }

  statusEl.innerHTML = `<span class="spinner"></span>Scanning 0 / ${total}...`;

  let chunkCursor = 0;
  async function chunkWorker() {
    while (chunkCursor < chunks.length) {
      const chunk = chunks[chunkCursor++];
      try {
        const res = await fetch('/api/ohlcv/batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ symbols: chunk, watchlist: selectedWatchlist }),
        });
        if (res.ok) {
          const data = await res.json();
          chunk.forEach(symbol => {
            const entry = data[symbol];
            if (entry) processCandles(symbol, entry.candles);
          });
        }
      } catch (e) {
        // Skip this chunk on network failure and keep scanning the rest.
      }

      done += chunk.length;
      if (myToken === screenerRunToken) {
        const shown = Math.min(done, total);
        statusEl.innerHTML = `<span class="spinner"></span>Scanning ${shown} / ${total}...`;
      }
    }
  }

  const chunkWorkers = [];
  for (let w = 0; w < CHUNK_CONCURRENCY; w++) chunkWorkers.push(chunkWorker());
  await Promise.all(chunkWorkers);

  if (myToken !== screenerRunToken) return; // a newer scan started; drop this one

  renderScreenerResults(results);
  statusEl.textContent = `Done — scanned ${total} symbols.`;
  btn.disabled = false;
  btn.textContent = 'Run Scan';
}

function renderScreenerResults(results) {
  const resultsEl = document.getElementById('screener-results');
  resultsEl.innerHTML = '';

  SCREENER_SENSITIVITIES.forEach(depth => {
    const group = document.createElement('div');
    group.className = 'sensi-group';

    const header = document.createElement('div');
    header.className = 'sensi-group-header';
    header.innerHTML = `<span class="label">Sensi ${depth}</span><span class="count">${results[depth].length}</span>`;
    group.appendChild(header);

    if (results[depth].length === 0) {
      const empty = document.createElement('div');
      empty.className = 'sensi-group-empty';
      empty.textContent = 'No VCPs found';
      group.appendChild(empty);
    } else {
      results[depth].forEach(({ symbol, lastClose }) => {
        const row = document.createElement('div');
        row.className = 'screener-row' + (symbol === activeSymbol ? ' active' : '');
        row.dataset.symbol = symbol;
        row.innerHTML = `
          <span class="ticker">${symbol}</span>
          <span class="price">${lastClose != null ? lastClose.toFixed(2) : ''}</span>
        `;
        row.addEventListener('click', () => {
          document.getElementById('wave-depth').value = depth;
          document.getElementById('depth-val').textContent = depth;
          selectSymbol(symbol);
        });
        group.appendChild(row);
      });
    }

    resultsEl.appendChild(group);
  });
}

document.getElementById('run-screener-btn').addEventListener('click', runScreener);

initChart();
loadSymbolList();
</script>
